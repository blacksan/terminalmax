name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK and run tests
        run: ./gradlew :androidApp:assembleDebug desktopTest --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: terminalmax-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Package desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: terminalmax-macos-arm64-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Package desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: terminalmax-windows-x64-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
